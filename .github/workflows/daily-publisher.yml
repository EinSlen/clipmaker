name: Daily TikTok and YouTube publisher
run-name: >-
  ${{ github.event_name == 'schedule' && (github.event.schedule == '37 0 * * *' && 'ClipMaker · scheduled generate' || 'ClipMaker · scheduled publish') || (inputs.scheduled_publish && format('ClipMaker · publish {0}', inputs.publish_slot) || format('ClipMaker · {0}', inputs.action)) }}

on:
  schedule:
    - cron: "37 0 * * *"
      timezone: Europe/Paris
    - cron: "7 18 * * *"
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      action:
        description: Cloud publisher operation
        required: true
        default: doctor
        type: choice
        options:
          - doctor
          - generate
          - publish
          - run
      dry_run:
        description: Never render or upload during this manual test
        required: true
        default: true
        type: boolean
      force_youtube:
        description: Retry YouTube even when the encrypted state says it was already published
        required: true
        default: false
        type: boolean
      force_tiktok:
        description: Retry TikTok after a verified empty Studio project
        required: true
        default: false
        type: boolean
      scheduled_publish:
        description: Respect the saved account publication times (cloud scheduler)
        required: false
        default: false
        type: boolean
      publish_slot:
        description: Publish only accounts assigned to this HH:MM slot
        required: false
        default: ''
        type: string
      schedule_date:
        description: Expected local date; abort an expired scheduled run
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: daily-tiktok-youtube-publisher
  cancel-in-progress: false

jobs:
  publisher:
    name: Generate or publish the daily videos
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      CONFIG_BUNDLE: ${{ secrets.PUBLISHER_CONFIG_GZIP_B64 }}
      SESSION_BUNDLE: ${{ secrets.PUBLISHER_SESSIONS_GZIP_B64 }}
      PUBLISHER_STATE_KEY: ${{ secrets.PUBLISHER_STATE_KEY }}
      CLIPMAKER_UPLOAD_TOKEN: ${{ secrets.CLIPMAKER_UPLOAD_TOKEN }}
      YOUTUBE_OAUTH_ACCOUNTS_B64: ${{ secrets.YOUTUBE_OAUTH_ACCOUNTS_B64 }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      MINIMAX_COOKIES_B64: ${{ secrets.MINIMAX_COOKIES_B64 }}
      CLOUD_CONTROL_API: https://clipmaker-cloud-control.einslen.workers.dev
      GH_TOKEN: ${{ github.token }}
      MANUAL_DRY_RUN: ${{ inputs.dry_run }}
      MANUAL_FORCE_YOUTUBE: ${{ inputs.force_youtube }}
      MANUAL_FORCE_TIKTOK: ${{ inputs.force_tiktok }}
    steps:
      - uses: actions/checkout@v6

      - name: Require the private runner credentials
        run: |
          test -n "$PUBLISHER_STATE_KEY" || { echo "La clé d'état chiffré manque." >&2; exit 1; }
          test -n "$CLIPMAKER_UPLOAD_TOKEN" || { echo "Le jeton interne ClipMaker manque." >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$MANUAL_DRY_RUN" != "true" ]; then
            test -n "$YOUTUBE_OAUTH_ACCOUNTS_B64" || { echo "Les comptes OAuth YouTube ne sont pas configurés." >&2; exit 1; }
          fi

      - name: Restore configuration and TikTok sessions from Cloudflare
        run: |
          if curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLIPMAKER_UPLOAD_TOKEN" \
            "$CLOUD_CONTROL_API/api/workflow/bootstrap" > /tmp/cloud-bootstrap.json; then
            export CLOUD_BOOTSTRAP=/tmp/cloud-bootstrap.json
          else
            test -n "$CONFIG_BUNDLE" || { echo "Synchronise d'abord le Studio ClipMaker avec le cloud." >&2; exit 1; }
            test -n "$SESSION_BUNDLE" || { echo "Les sessions TikTok ne sont pas synchronisées." >&2; exit 1; }
          fi
          python3 - <<'PY'
          import base64
          import gzip
          import json
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          target = root / "web" / "config" / "publisher.json"
          target.parent.mkdir(parents=True, exist_ok=True)
          cloud = os.environ.get("CLOUD_BOOTSTRAP")
          if cloud:
              payload = json.loads(Path(cloud).read_text(encoding="utf-8"))
              target.write_text(json.dumps(payload["config"], ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              session_bundle = payload["sessionsBundle"]
          else:
              config = gzip.decompress(base64.b64decode(os.environ["CONFIG_BUNDLE"]))
              target.write_bytes(config)
              session_bundle = os.environ["SESSION_BUNDLE"]

          bundle = json.loads(gzip.decompress(base64.b64decode(session_bundle)))
          for relative, encoded in bundle.get("files", {}).items():
              destination = (root / relative).resolve()
              if root not in destination.parents:
                  raise RuntimeError("Unsafe session path")
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(base64.b64decode(encoded))
          PY

      - name: Restore the latest encrypted publisher state
        run: |
          mkdir -p web/data/publisher web/data/story web/renders artifacts/runtime
          artifact_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts?name=daily-publisher-runtime&per_page=1" --jq '.artifacts[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/publisher-runtime.zip
            unzip -q /tmp/publisher-runtime.zip -d /tmp/publisher-runtime
            openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
              -pass env:PUBLISHER_STATE_KEY \
              -in /tmp/publisher-runtime/publisher-runtime.enc \
              -out /tmp/publisher-runtime.tar.gz
            tar -xzf /tmp/publisher-runtime.tar.gz -C "$PWD"
          fi

      - name: Build the cloud publisher image
        run: docker build --file web/Dockerfile --target ci --tag clipmaker-ci:publisher .

      - name: Start the private ClipMaker API
        id: runtime
        run: |
          publisher_dry_run="$(node web/scripts/publisher-runner-mode.mjs web/config/publisher.json)"
          echo "dry_run=$publisher_dry_run" >> "$GITHUB_OUTPUT"
          docker run --detach --rm --init --name clipmaker-daily --network host \
            --env REPO_ROOT=/repo \
            --env PYTHON_BIN=python3 \
            --env BLENDER_BIN=blender \
            --env YOUTUBE_UPLOAD_PROVIDER=youtube-data-api \
            --env YOUTUBE_API_DRY_RUN="$publisher_dry_run" \
            --env YOUTUBE_OAUTH_ACCOUNTS_B64="$YOUTUBE_OAUTH_ACCOUNTS_B64" \
            --env MINIMAX_COOKIES_B64="$MINIMAX_COOKIES_B64" \
            --env STORY_CLIP_MODE="${STORY_CLIP_MODE:-auto}" \
            --env YOUTUBE_ALLOW_PUBLIC_UPLOAD=true \
            --env PUBLISHER_DRY_RUN="$publisher_dry_run" \
            --env CLIPMAKER_UPLOAD_TOKEN="$CLIPMAKER_UPLOAD_TOKEN" \
            --env YOUTUBE_API_KEY="$YOUTUBE_API_KEY" \
            --env CLOUD_CONTROL_API="$CLOUD_CONTROL_API" \
            --volume "$PWD:/repo" \
            --volume "$PWD/web/renders:/app/renders" \
            --volume "$PWD/web/uploads:/app/uploads" \
            clipmaker-ci:publisher npm start
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          docker logs clipmaker-daily >&2
          exit 1

      - name: Select the scheduled or manual operation
        id: operation
        env:
          MANUAL_ACTION: ${{ inputs.action }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "37 0 * * *" ]; then
            command="generate"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            command="publish"
          else
            command="$MANUAL_ACTION"
          fi
          echo "command=$command" >> "$GITHUB_OUTPUT"

      - name: Scope publication to the accounts due now
        id: scope
        if: ${{ steps.operation.outputs.command == 'publish' || steps.operation.outputs.command == 'run' }}
        env:
          SCHEDULED_PUBLISH: ${{ github.event_name == 'schedule' || inputs.scheduled_publish }}
          PUBLISH_SLOT: ${{ inputs.publish_slot }}
          EXPECTED_DATE: ${{ inputs.schedule_date }}
        run: |
          node web/scripts/scope-publisher.mjs --config web/config/publisher.json \
            --scheduled "$SCHEDULED_PUBLISH" --slot "$PUBLISH_SLOT" --date "$EXPECTED_DATE" \
            > artifacts/schedule-scope.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          scope = json.loads(Path("artifacts/schedule-scope.json").read_text())
          print("Comptes de ce créneau : " + (", ".join(scope["channels"]) or "aucun"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("date=" + scope["date"] + "\n")
          PY

      - name: Import today's completed 3D renders
        id: imports
        if: ${{ (steps.operation.outputs.command == 'publish' || steps.operation.outputs.command == 'run') && steps.runtime.outputs.dry_run == 'false' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_DATE: ${{ steps.scope.outputs.date }}
          ALLOW_DEFERRED_3D: ${{ github.event_name == 'schedule' || inputs.scheduled_publish }}
        run: |
          echo "ready=true" >> "$GITHUB_OUTPUT"
          expected="$(python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("web/config/publisher.json").read_text(encoding="utf-8"))
          print(sum(1 for channel in config.get("channels", [])
                    if channel.get("enabled", True) and channel.get("game", {}).get("id") == "soft-body-slide"))
          PY
          )"
          if [ "$expected" -eq 0 ]; then exit 0; fi
          today="$PUBLISH_DATE"
          test -n "$today" || { echo "Date de publication absente." >&2; exit 1; }
          mkdir -p artifacts/soft-body-imports
          imported=0
          declare -A imported_channels=()
          # Cloudflare starts the same production workflow via dispatch. Test
          # branches are never eligible, and a newer render must win over an
          # older run for the same day (an ascending path sort did the reverse).
          for run_id in $(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/soft-body-artifact.yml/runs" \
            -f status=success -f branch="$DEFAULT_BRANCH" -f per_page=20 \
            --jq '.workflow_runs | sort_by(.created_at, .run_number) | reverse | .[] | select(.event == "schedule" or .event == "workflow_dispatch") | .id'); do
            while IFS=$'\t' read -r artifact_id artifact_name; do
              [ -n "$artifact_id" ] || continue
              target="artifacts/soft-body-imports/${run_id}-${artifact_name}"
              mkdir -p "$target"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/soft-body-artifact.zip
              unzip -oq /tmp/soft-body-artifact.zip -d "$target"
              manifest="$target/publisher-import.json"
              test -s "$manifest" || { echo "Manifeste 3D absent : $artifact_name" >&2; exit 1; }
              channel_id="$(python3 - "$manifest" "$today" <<'PY'
          import json
          import sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          config = json.loads(Path("web/config/publisher.json").read_text(encoding="utf-8"))
          channel_id = manifest.get("channelId")
          if any(channel.get("enabled", True) and channel.get("id") == channel_id
                 and channel.get("game", {}).get("id") == "soft-body-slide"
                 for channel in config.get("channels", [])):
              if manifest.get("date") != sys.argv[2]:
                  raise SystemExit("Date du manifeste 3D incohérente avec l'artefact quotidien")
              print(channel_id)
          PY
              )"
              # A manual preview uses manual-3d, not a configured daily channel.
              [ -n "$channel_id" ] || continue
              if [ -n "${imported_channels[$channel_id]:-}" ]; then continue; fi
              # Fail closed on invalid new evidence; do not fall back to an
              # older video that lacks the current contact-quality checks.
              restore=()
              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
                && { [ "$MANUAL_FORCE_YOUTUBE" = "true" ] || [ "$MANUAL_FORCE_TIKTOK" = "true" ]; }; then
                restore+=(--restore-published-video)
              fi
              docker exec clipmaker-daily node /repo/web/scripts/publisher.mjs import-3d \
                --config /repo/web/config/publisher.json --manifest "/repo/$manifest" \
                "${restore[@]}" > "${manifest%.json}-result.json"
              imported_channels[$channel_id]=1
              imported=$((imported + 1))
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.expired == false) | select(.name | startswith(\"soft-body-daily-${today}-\")) | [.id,.name] | @tsv")
            if [ "$imported" -eq "$expected" ]; then break; fi
          done
          if [ "$imported" -ne "$expected" ]; then
            message="Rendus 3D prêts : $imported/$expected. Aucune ancienne vidéo ne sera publiée."
            echo "$message" >&2
            if [ "$ALLOW_DEFERRED_3D" = "true" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "reason=$message" >> "$GITHUB_OUTPUT"
              echo "::notice title=Publication différée::$message Le workflow de rattrapage reprendra automatiquement."
              exit 0
            fi
            exit 1
          fi

      - name: Check connected accounts
        if: ${{ steps.imports.outputs.ready != 'false' }}
        run: |
          docker exec clipmaker-daily node /repo/web/scripts/publisher.mjs doctor \
            --config /repo/web/config/publisher.json > artifacts/doctor.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/doctor.json").read_text(encoding="utf-8"))
          if not report.get("ok"):
              enabled = [c for c in report.get("channels", []) if c.get("enabled")]
              broken = []
              for channel in enabled:
                  endpoints = channel.get("endpoints", {})
                  failed = [name for name, status in endpoints.items()
                            if isinstance(status, dict) and status.get("ok") is False]
                  if failed:
                      broken.append(f"{channel.get('id', '?')}: {', '.join(failed)}")
              # One unusable account must not cancel the work of every other
              # channel: the publisher already isolates a channel that fails.
              # The run only stops when nothing at all can be published, or when
              # the diagnosis names no channel and cannot be acted upon.
              if not broken:
                  raise SystemExit("Diagnostic invalide.")
              print("::warning::Compte(s) non prêt(s) : " + " · ".join(broken))
              if len(broken) == len(enabled):
                  raise SystemExit("Aucun compte prêt : " + " · ".join(broken))
          PY

      - name: Execute the publisher operation
        if: ${{ steps.imports.outputs.ready != 'false' }}
        env:
          COMMAND: ${{ steps.operation.outputs.command }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_DATE: ${{ steps.scope.outputs.date }}
        run: |
          extra=()
          if [ -n "$PUBLISH_DATE" ]; then extra+=(--date "$PUBLISH_DATE"); fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_DRY_RUN" = "true" ]; then
            extra+=(--dry-run)
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_FORCE_YOUTUBE" = "true" ]; then
            extra+=(--force-platform youtube)
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_FORCE_TIKTOK" = "true" ]; then
            extra+=(--force-platform tiktok)
          fi
          if [ "$COMMAND" = "generate" ] || [ "$COMMAND" = "run" ]; then
            extra+=(--skip-game soft-body-slide)
          fi
          docker exec clipmaker-daily node /repo/web/scripts/publisher.mjs "$COMMAND" \
            --config /repo/web/config/publisher.json "${extra[@]}" > artifacts/result.json

      - name: Save a safe status summary
        if: always()
        env:
          COMMAND: ${{ steps.operation.outputs.command }}
          IMPORT_READY: ${{ steps.imports.outputs.ready }}
          IMPORT_REASON: ${{ steps.imports.outputs.reason }}
        run: |
          if docker ps --format '{{.Names}}' | grep -qx clipmaker-daily; then
            docker exec clipmaker-daily node /repo/web/scripts/publisher.mjs status \
              --config /repo/web/config/publisher.json > artifacts/status.json || true
          fi
          node web/scripts/publisher-summary.mjs \
            --config web/config/publisher.json \
            --doctor artifacts/doctor.json \
            --status artifacts/status.json \
            --operation "${COMMAND:-unknown}" \
            --output artifacts/summary.md
          if [ "$IMPORT_READY" = "false" ]; then
            printf '\n## Publication différée\n\n- %s\n- Le rattrapage démarrera automatiquement dès que le rendu 3D quotidien sera disponible.\n' \
              "$IMPORT_REASON" >> artifacts/summary.md
          fi
          cat artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Notify the owner through GitHub
        # A deliberately cancelled stale catch-up must not create a false red
        # notification after a newer run has taken over the publication.
        if: ${{ always() && !cancelled() }}
        env:
          OPERATION: ${{ steps.operation.outputs.command }}
          RUN_STATUS: ${{ job.status }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          EFFECTIVE_DRY_RUN: ${{ steps.runtime.outputs.dry_run }}
          IMPORT_READY: ${{ steps.imports.outputs.ready }}
        run: |
          gh label create clipmaker-status --repo "$GITHUB_REPOSITORY" \
            --color 7c3aed --description "Notifications quotidiennes ClipMaker" --force
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --label clipmaker-status \
            --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -z "$issue" ]; then
            issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Notifications quotidiennes ClipMaker" \
              --label clipmaker-status \
              --body "Ce ticket reçoit les comptes rendus automatiques du cron ClipMaker. Garde-le ouvert et abonné.")"
            issue="${issue_url##*/}"
          fi
          if [ "$IMPORT_READY" = "false" ]; then
            icon="⏳"
            verdict="En attente du rendu 3D"
          elif [ "$RUN_STATUS" = "success" ]; then
            icon="✅"
            verdict="Terminé"
          else
            icon="❌"
            verdict="Échec"
          fi
          mode="réel"
          if [ "$EFFECTIVE_DRY_RUN" = "true" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_DRY_RUN" = "true" ]; }; then
            mode="test sans rendu ni publication"
          fi
          operation="${OPERATION:-initialisation}"
          summary="$(cat artifacts/summary.md 2>/dev/null || printf '%s\n' '- Aucun état disponible.')"
          cat > artifacts/notification.md <<EOF
          @$GITHUB_REPOSITORY_OWNER

          ## $icon ClipMaker — $verdict

          - Action : \`$operation\`
          - Mode : $mode
          - Heure : $(date -u '+%Y-%m-%d %H:%M UTC')
          - Exécution : [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          $summary
          EOF
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
            --body-file artifacts/notification.md

      - name: Remove videos that were fully published
        if: ${{ success() && steps.imports.outputs.ready != 'false' && (steps.operation.outputs.command == 'publish' || steps.operation.outputs.command == 'run') }}
        run: |
          docker exec clipmaker-daily node /repo/web/scripts/publisher.mjs cleanup \
            --config /repo/web/config/publisher.json > artifacts/cleanup.json

      - name: Encrypt state and pending videos for the next run
        if: always()
        run: |
          mkdir -p artifacts/runtime web/data/publisher web/data/story web/renders
          # State files are intentionally mode 0600 inside the private API
          # container. The hosted runner uses a different UID, so grant its
          # ephemeral user read access immediately before local encryption.
          sudo chmod -R a+rX web/data/publisher web/data/story web/renders
          sudo rm -f /tmp/publisher-runtime.tar.gz
          tar -czf /tmp/publisher-runtime.tar.gz web/data/publisher web/data/story web/renders
          openssl enc -aes-256-cbc -salt -pbkdf2 -md sha256 \
            -pass env:PUBLISHER_STATE_KEY \
            -in /tmp/publisher-runtime.tar.gz \
            -out artifacts/runtime/publisher-runtime.enc

      - name: Upload only the encrypted runtime
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-publisher-runtime
          path: artifacts/runtime/publisher-runtime.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Stop the private API
        if: always()
        run: docker stop clipmaker-daily >/dev/null 2>&1 || true
