name: Soft Body 3D artifact

on:
  schedule:
    - cron: "7 0 * * *"
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      use_cloud_config:
        description: Validate the configured 3D channels instead of a manual render
        required: true
        default: false
        type: boolean
      plan_only:
        description: Validate the cloud matrix without starting the expensive render
        required: true
        default: false
        type: boolean
      reuse_run_id:
        description: Reassemble native frames from an earlier run without rendering again
        required: false
        default: ""
        type: string
      obstacle:
        description: Obstacle rendered in the 3D comparison
        required: true
        default: peg-grid
        type: choice
        options: [peg-grid, moving-slide, stair-cascade, v-stairs, pipe-bend, twin-gears, compression-ring]
      seed:
        description: Deterministic simulation seed
        required: true
        default: "910104"
        type: string
      samples:
        description: Eevee samples per native frame
        required: true
        default: "64"
        type: choice
        options: ["32", "64", "128"]
      chunk_size:
        description: Frames rendered by each parallel runner
        required: true
        default: "15"
        type: choice
        options: ["15", "30", "45"]
      title:
        description: Internal English hook stored in the scene
        required: true
        default: HOW SOFT CAN IT GET?
        type: string
      music_profile:
        description: Spoken edit library, optional songs or original instrumental
        required: false
        default: original
        type: choice
        options: [edit-auto, edit-sad, edit-revenge, original, auto, revenge, sad-english]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: soft-body-3d-${{ github.run_id }}
  cancel-in-progress: false

env:
  FRAME_COUNT: "900"
  RENDER_FPS: "30"
  RENDER_DURATION: "30"
  RENDER_WIDTH: "1080"
  RENDER_HEIGHT: "1920"
  CLOUD_CONTROL_API: https://clipmaker-cloud-control.einslen.workers.dev

jobs:
  plan:
    name: Plan channels and native frame chunks
    runs-on: ubuntu-22.04
    outputs:
      channels: ${{ steps.matrix.outputs.channels }}
      frames: ${{ steps.matrix.outputs.frames }}
      has_channels: ${{ steps.matrix.outputs.has_channels }}
      render_enabled: ${{ steps.matrix.outputs.render_enabled }}
    env:
      CLIPMAKER_UPLOAD_TOKEN: ${{ secrets.CLIPMAKER_UPLOAD_TOKEN }}
      MANUAL_OBSTACLE: ${{ inputs.obstacle }}
      MANUAL_SEED: ${{ inputs.seed }}
      MANUAL_SAMPLES: ${{ inputs.samples }}
      MANUAL_CHUNK_SIZE: ${{ inputs.chunk_size }}
      MANUAL_TITLE: ${{ inputs.title }}
      MANUAL_MUSIC_PROFILE: ${{ inputs.music_profile }}
      USE_CLOUD_CONFIG: ${{ github.event_name == 'schedule' || inputs.use_cloud_config }}
      PLAN_ONLY: ${{ inputs.plan_only || false }}
      REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@v6
      - name: Load the private cloud configuration for a scheduled run
        if: ${{ github.event_name == 'schedule' || inputs.use_cloud_config }}
        run: |
          test -n "$CLIPMAKER_UPLOAD_TOKEN" || { echo "Le jeton ClipMaker manque." >&2; exit 1; }
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLIPMAKER_UPLOAD_TOKEN" \
            "$CLOUD_CONTROL_API/api/workflow/bootstrap" > /tmp/cloud-bootstrap.json

      - id: matrix
        name: Build the channel and frame matrices
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          sys.path.insert(0, "web/scripts")
          from edit_audio import EDIT_PROFILES, select_clip, fetch_clip

          today = datetime.now(ZoneInfo("Europe/Paris")).date().isoformat()
          channels = []
          use_cloud_config = os.environ.get("USE_CLOUD_CONFIG", "false").lower() == "true"
          plan_only = os.environ.get("PLAN_ONLY", "false").lower() == "true"
          reuse_run_id = os.environ.get("REUSE_RUN_ID", "").strip()
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" and not use_cloud_config:
              channels.append({
                  "channel_id": "manual-3d", "key": "manual-3d", "date": today,
                  "seed": int(os.environ.get("MANUAL_SEED") or "910104"),
                  "obstacle": os.environ.get("MANUAL_OBSTACLE") or "peg-grid",
                  "samples": int(os.environ.get("MANUAL_SAMPLES") or "64"),
                  "chunk_size": int(os.environ.get("MANUAL_CHUNK_SIZE") or "15"),
                  "title": (os.environ.get("MANUAL_TITLE") or "HOW SOFT CAN IT GET?")[:52],
                  "scheduled": False,
                  "music_profile": os.environ.get("MANUAL_MUSIC_PROFILE") or "original",
                  "music_volume": 0.58,
              })
          else:
              payload = json.loads(Path("/tmp/cloud-bootstrap.json").read_text(encoding="utf-8"))
              config = payload["config"]
              namespace = config.get("seedNamespace", "clipmaker-daily-v1")
              for channel in config.get("channels", []):
                  game = channel.get("game", {})
                  if not channel.get("enabled", True) or game.get("id") != "soft-body-slide":
                      continue
                  channel_id = channel["id"]
                  digest = hashlib.sha256(f"{namespace}:{channel_id}:{today}".encode()).digest()
                  seed = int.from_bytes(digest[:4], "big") & 0x7fffffff or 1
                  channels.append({
                      "channel_id": channel_id,
                      "key": re.sub(r"[^a-z0-9_-]", "-", channel_id.lower()),
                      "date": today, "seed": seed, "obstacle": game.get("obstacle", "auto"),
                      "samples": 64, "chunk_size": 15,
                      "title": str(game.get("title") or "HOW SOFT CAN IT GET?")[:52],
                      "scheduled": True,
                      "music_profile": game.get("musicProfile", "original"),
                      "music_volume": game.get("musicVolume", 0.58),
                  })
          if len(channels) > 8:
              raise SystemExit("Maximum 8 canaux 3D par dépôt.")
          # GitHub limits a job matrix to 256 entries. Keep short, reliable
          # chunks while there are at most four 3D channels, then use 30-frame
          # chunks so all eight supported channels still fit in one matrix.
          if len(channels) > 4:
              for channel in channels:
                  if channel["scheduled"]:
                      channel["chunk_size"] = 30
          frames = []
          for channel in channels:
              if channel["music_profile"] not in (*EDIT_PROFILES, "auto", "revenge", "sad-english", "original"):
                  raise SystemExit("Invalid vocal playlist")
              if not isinstance(channel["music_volume"], (int, float)) or not 0 <= channel["music_volume"] <= 1:
                  raise SystemExit("Invalid soundtrack volume")
              if channel["music_profile"] in EDIT_PROFILES:
                  if channel["music_volume"] <= 0:
                      raise SystemExit("Spoken edit volume must be greater than zero")
                  clip = select_clip(channel["seed"], channel["music_profile"], channel["date"], channel["channel_id"])
                  fetch_clip(clip)
                  channel["edit_clip_id"] = clip["id"]
          total = int(os.environ["FRAME_COUNT"])
          for channel in channels:
              for index, start in enumerate(range(1, total + 1, channel["chunk_size"]), 1):
                  frames.append({**channel, "index": index, "start": start, "end": min(total, start + channel["chunk_size"] - 1)})
          compact = lambda value: json.dumps({"include": value}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("channels=" + compact(channels) + "\n")
              output.write("frames=" + compact(frames) + "\n")
              output.write("has_channels=" + ("true" if channels else "false") + "\n")
              output.write("render_enabled=" + ("true" if channels and not plan_only and not reuse_run_id else "false") + "\n")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["# Soft Body 3D plan", "", f"- Channels: `{len(channels)}`", f"- Native frames: `{len(frames)}`", f"- Plan only: `{'yes' if plan_only else 'no'}`", f"- Reassemble run: `{reuse_run_id or 'no'}`", ""]
          lines.extend(f"- `{channel['channel_id']}` · `{channel['obstacle']}` · seed `{channel['seed']}`" for channel in channels)
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat "$GITHUB_STEP_SUMMARY"

  prepare:
    name: Simulate ${{ matrix.channel_id }}
    needs: plan
    if: ${{ needs.plan.outputs.render_enabled == 'true' }}
    runs-on: ubuntu-22.04
    # Native closed-volume checks inspect every subdivided vertex of all three
    # bodies. The 90-minute budget expired during the final 100% comparison;
    # keep every check and allow the complete five-stage preparation to finish.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.channels) }}
    steps:
      - uses: actions/checkout@v6
      - name: Build the reproducible renderer
        run: docker build --file web/Dockerfile --target ci --tag clipmaker-ci:3d .
      - name: Simulate every softness level once
        run: |
          mkdir -p artifacts/scene/frames
          docker run --rm --init --volume "$PWD/artifacts/scene:/scene" clipmaker-ci:3d \
            blender --background --factory-startup --python-exit-code 1 --python scripts/blender-soft-body-slide.py -- \
              --frames /scene/frames --duration "$RENDER_DURATION" --fps "$RENDER_FPS" \
              --width "$RENDER_WIDTH" --height "$RENDER_HEIGHT" --samples "${{ matrix.samples }}" \
              --seed "${{ matrix.seed }}" --softness 100 --theme ice --title "${{ matrix.title }}" \
              --obstacle "${{ matrix.obstacle }}" --events /scene/motion-events.json --build-only
          test -s artifacts/scene/frames/soft-body-comparison.blend
          test -s artifacts/scene/motion-events.json
      - uses: actions/upload-artifact@v6
        with:
          name: soft-body-scene-${{ matrix.key }}
          path: artifacts/scene
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  render:
    name: ${{ matrix.channel_id }} · frames ${{ matrix.start }}-${{ matrix.end }}
    needs: [plan, prepare]
    if: ${{ needs.plan.outputs.render_enabled == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    continue-on-error: true
    strategy:
      fail-fast: false
      # Leave two repository runner slots available for the publisher and CI.
      max-parallel: 18
      matrix: ${{ fromJSON(needs.plan.outputs.frames) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: soft-body-scene-${{ matrix.key }}
          path: artifacts/scene
      - name: Build the reproducible renderer
        run: docker build --file web/Dockerfile --target ci --tag clipmaker-ci:3d .
      - name: Render this native frame range
        run: |
          mkdir -p artifacts/chunk
          docker run --rm --init --volume "$PWD/artifacts/scene:/scene:ro" --volume "$PWD/artifacts/chunk:/output" \
            clipmaker-ci:3d blender --background /scene/frames/soft-body-comparison.blend \
              --render-output /output/frame_ --frame-start "${{ matrix.start }}" --frame-end "${{ matrix.end }}" --render-anim
          test -s "artifacts/chunk/frame_$(printf '%04d' '${{ matrix.start }}').png"
          test -s "artifacts/chunk/frame_$(printf '%04d' '${{ matrix.end }}').png"
      - uses: actions/upload-artifact@v6
        with:
          name: soft-body-frames-${{ matrix.key }}-${{ matrix.index }}
          path: artifacts/chunk
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  retry_plan:
    name: Find missing native frame chunks
    needs: [plan, prepare, render]
    if: ${{ always() && needs.plan.outputs.render_enabled == 'true' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    outputs:
      frames: ${{ steps.missing.outputs.frames }}
      has_missing: ${{ steps.missing.outputs.has_missing }}
      missing_count: ${{ steps.missing.outputs.missing_count }}
    env:
      GH_TOKEN: ${{ github.token }}
      FRAME_MATRIX: ${{ needs.plan.outputs.frames }}
    steps:
      - id: missing
        name: Compare expected chunks with uploaded artifacts
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > /tmp/render-artifact-pages.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix = json.loads(os.environ["FRAME_MATRIX"])
          pages = json.loads(Path("/tmp/render-artifact-pages.json").read_text(encoding="utf-8"))
          existing = {
              artifact["name"]
              for page in pages
              for artifact in page.get("artifacts", [])
          }
          missing = [
              frame
              for frame in matrix.get("include", [])
              if f"soft-body-frames-{frame['key']}-{frame['index']}" not in existing
          ]
          compact = json.dumps({"include": missing}, separators=(",", ":"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"frames={compact}\n")
              output.write(f"has_missing={'true' if missing else 'false'}\n")
              output.write(f"missing_count={len(missing)}\n")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "# Native frame retry\n\n"
              f"- Missing chunks: `{len(missing)}`\n"
              + "".join(
                  f"- `{frame['channel_id']}` · frames `{frame['start']}-{frame['end']}`\n"
                  for frame in missing
              ),
              encoding="utf-8",
          )
          PY

  retry:
    name: Retry ${{ matrix.channel_id }} · frames ${{ matrix.start }}-${{ matrix.end }}
    needs: [plan, prepare, retry_plan]
    if: ${{ needs.retry_plan.outputs.has_missing == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # Retries must not block the time-sensitive publication workflow either.
      max-parallel: 18
      matrix: ${{ fromJSON(needs.retry_plan.outputs.frames) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: soft-body-scene-${{ matrix.key }}
          path: artifacts/scene
      - name: Build the reproducible renderer
        run: docker build --file web/Dockerfile --target ci --tag clipmaker-ci:3d .
      - name: Render the missing native frame range
        run: |
          mkdir -p artifacts/chunk
          docker run --rm --init --volume "$PWD/artifacts/scene:/scene:ro" --volume "$PWD/artifacts/chunk:/output" \
            clipmaker-ci:3d blender --background /scene/frames/soft-body-comparison.blend \
              --render-output /output/frame_ --frame-start "${{ matrix.start }}" --frame-end "${{ matrix.end }}" --render-anim
          test -s "artifacts/chunk/frame_$(printf '%04d' '${{ matrix.start }}').png"
          test -s "artifacts/chunk/frame_$(printf '%04d' '${{ matrix.end }}').png"
      - uses: actions/upload-artifact@v6
        with:
          name: soft-body-frames-${{ matrix.key }}-${{ matrix.index }}
          path: artifacts/chunk
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  assemble:
    name: Assemble ${{ matrix.channel_id }}
    needs: [plan, prepare, render, retry_plan, retry]
    if: ${{ always() && needs.plan.outputs.render_enabled == 'true' && needs.prepare.result == 'success' && needs.retry_plan.result == 'success' && (needs.retry_plan.outputs.has_missing == 'false' || needs.retry.result == 'success') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.channels) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: soft-body-scene-${{ matrix.key }}
          path: artifacts/scene
      - uses: actions/download-artifact@v7
        with:
          pattern: soft-body-frames-${{ matrix.key }}-*
          path: artifacts/frames
          merge-multiple: true
      - name: Require the complete native sequence
        run: test "$(find artifacts/frames -maxdepth 1 -name 'frame_*.png' | wc -l)" -eq "$FRAME_COUNT"
      - name: Build the reproducible renderer
        run: docker build --file web/Dockerfile --target ci --tag clipmaker-ci:3d .
      - name: Encode video, selected soundtrack and collision Foley
        env:
          CLIPMAKER_UPLOAD_TOKEN: ${{ secrets.CLIPMAKER_UPLOAD_TOKEN }}
          MUSIC_PROFILE: ${{ matrix.music_profile }}
          MUSIC_VOLUME: ${{ matrix.music_volume }}
          MUSIC_DATE: ${{ matrix.date }}
          MUSIC_CHANNEL: ${{ matrix.channel_id }}
        run: |
          mkdir -p artifacts/final
          docker run --rm --init --volume "$PWD/artifacts/frames:/frames:ro" --volume "$PWD/artifacts/scene:/scene:ro" \
            --volume "$PWD/artifacts/final:/final" --env CLIPMAKER_UPLOAD_TOKEN clipmaker-ci:3d python3 scripts/finalize-premium-3d.py \
              --frames /frames --events /scene/motion-events.json \
              --output "/final/soft-body-${{ matrix.obstacle }}-${{ matrix.seed }}.mp4" \
              --metadata /final/metadata.json --duration "$RENDER_DURATION" --fps "$RENDER_FPS" \
              --seed "${{ matrix.seed }}" --obstacle "${{ matrix.obstacle }}" \
              --music-profile "$MUSIC_PROFILE" --music-volume "$MUSIC_VOLUME" \
              --date "$MUSIC_DATE" --channel-id "$MUSIC_CHANNEL"
      - name: Create the publisher import manifest and verify the MP4
        env:
          CHANNEL_ID: ${{ matrix.channel_id }}
          DAILY_DATE: ${{ matrix.date }}
          DAILY_SEED: ${{ matrix.seed }}
          DAILY_OBSTACLE: ${{ matrix.obstacle }}
          DAILY_TITLE: ${{ matrix.title }}
          DAILY_EDIT_CLIP_ID: ${{ matrix.edit_clip_id || '' }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import {assertEditAudioQuality} from './web/src/automation/edit-audio-quality.mjs'; assertEditAudioQuality(JSON.parse(fs.readFileSync('artifacts/final/metadata.json','utf8')));"
          video="artifacts/final/soft-body-${DAILY_OBSTACLE}-${DAILY_SEED}.mp4"
          docker run --rm --volume "$PWD/artifacts/final:/final:ro" clipmaker-ci:3d \
            ffprobe -v error \
              -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,nb_frames,sample_rate,channels \
              -show_entries format=duration,size -of json "/final/$(basename "$video")" \
              > artifacts/final/ffprobe.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("artifacts/final/metadata.json").read_text(encoding="utf-8"))
          if os.environ.get("DAILY_EDIT_CLIP_ID") and metadata.get("music_track_id") != os.environ["DAILY_EDIT_CLIP_ID"]:
              raise SystemExit("Spoken clip differs from the preflight selection; refusing replacement")
          probe = json.loads(Path("artifacts/final/ffprobe.json").read_text(encoding="utf-8"))
          streams = probe.get("streams", [])
          video_stream = next((stream for stream in streams if stream.get("codec_type") == "video"), None)
          audio_stream = next((stream for stream in streams if stream.get("codec_type") == "audio"), None)
          expected_video = ("h264", 1080, 1920, "30/1", "900")
          actual_video = tuple((video_stream or {}).get(key) for key in ("codec_name", "width", "height", "r_frame_rate", "nb_frames"))
          if actual_video != expected_video:
              raise SystemExit(f"Unexpected production video stream: {video_stream}")
          expected_audio = ("aac", "48000", 2)
          actual_audio = tuple((audio_stream or {}).get(key) for key in ("codec_name", "sample_rate", "channels"))
          if actual_audio != expected_audio:
              raise SystemExit(f"Unexpected production audio stream: {audio_stream}")
          duration = float(probe.get("format", {}).get("duration", 0))
          if not 29.9 <= duration <= 30.1:
              raise SystemExit(f"Unexpected production duration: {duration}")
          cleared_vocals = (metadata.get("music_provider") == "ncs"
                            and metadata.get("music_has_vocals") is True
                            and metadata.get("music_clearance") == "ncs-independent-creator-ugc"
                            and metadata.get("music_license_url") == "https://ncs.io/usage-policy/terms"
                            and bool(metadata.get("music_credit")) and bool(metadata.get("music_source_sha256")))
          spoken_edit = (metadata.get("music_provider") == "private-edit-library"
                         and metadata.get("music_content_kind") == "spoken"
                         and metadata.get("music_clearance") == "user-attested-cross-platform"
                         and metadata.get("music_sentence_reviewed") is True
                         and metadata.get("music_looped") is False
                         and bool(metadata.get("music_rights_evidence"))
                         and bool(metadata.get("music_source_sha256")))
          if (metadata.get("music_generated") is not True and not cleared_vocals and not spoken_edit) or metadata.get("sound_pack") != "premium-foley":
              raise SystemExit("Missing soundtrack clearance or collision Foley metadata")
          title = os.environ["DAILY_TITLE"]
          video = f"soft-body-{os.environ['DAILY_OBSTACLE']}-{os.environ['DAILY_SEED']}.mp4"
          manifest = {
              "date": os.environ["DAILY_DATE"], "channelId": os.environ["CHANNEL_ID"],
              "seed": int(os.environ["DAILY_SEED"]), "video": video,
              "render": {
                  "title": title, "youtubeTitle": f"{title} #shorts",
                  "caption": f"{title} 0% to 100% soft body comparison. Did you predict the ending?" + ("\n\n" + metadata["music_credit"] if metadata.get("music_credit") else ""),
                  "tags": ["#softbody", "#satisfying", "#simulation", "#shorts"],
                  "duration": 30, "outcome": "comparison-complete",
                  "variantKey": metadata.get("variant_key", os.environ["DAILY_OBSTACLE"]), "raw": metadata,
              },
          }
          Path("artifacts/final/publisher-import.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("artifacts/final/report.md").write_text(
              f"# Soft Body 3D production\n\n- Channel: `{os.environ['CHANNEL_ID']}`\n- Obstacle: `{os.environ['DAILY_OBSTACLE']}`\n- Native: `1080x1920 @ 30 fps`\n- Frames: `{metadata['frames']}`\n- Outcome: `{metadata['outcome']}`\n- Music: {metadata.get('music', 'unknown')}\n- Playlist: `{metadata.get('music_profile', 'original')}`\n- Source: {metadata.get('music_source_url', 'original')}\n",
              encoding="utf-8",
          )
          PY
          cat artifacts/final/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: soft-body-daily-${{ matrix.date }}-${{ matrix.key }}
          path: artifacts/final
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  reassemble:
    name: Reassemble run ${{ inputs.reuse_run_id }}
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_run_id != '' && needs.plan.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.reuse_run_id }}
      RECOVERY_SEED: ${{ inputs.seed }}
      RECOVERY_OBSTACLE: ${{ inputs.obstacle }}
      RECOVERY_MUSIC_PROFILE: ${{ inputs.music_profile || 'original' }}
      CLIPMAKER_UPLOAD_TOKEN: ${{ secrets.CLIPMAKER_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Download the previous native scene and all frame chunks
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Run ID must be numeric." >&2; exit 1; }
          mkdir -p artifacts/scene artifacts/frames artifacts/chunks
          gh run download "$SOURCE_RUN_ID" --name soft-body-shared-scene --dir artifacts/scene
          for index in $(seq 1 30); do
            chunk="artifacts/chunks/$index"
            mkdir -p "$chunk"
            gh run download "$SOURCE_RUN_ID" --name "soft-body-frames-$index" --dir "$chunk"
            find "$chunk" -maxdepth 1 -type f -name 'frame_*.png' -exec mv -t artifacts/frames {} +
          done
          test -s artifacts/scene/motion-events.json
      - name: Require the complete recovered native sequence
        run: test "$(find artifacts/frames -maxdepth 1 -name 'frame_*.png' | wc -l)" -eq "$FRAME_COUNT"
      - name: Build the fixed reproducible renderer
        run: docker build --file web/Dockerfile --target ci --tag clipmaker-ci:3d .
      - name: Encode from the immutable recovered frames
        run: |
          mkdir -p artifacts/final
          docker run --rm --init --volume "$PWD/artifacts/frames:/frames:ro" --volume "$PWD/artifacts/scene:/scene:ro" \
            --volume "$PWD/artifacts/final:/final" --env CLIPMAKER_UPLOAD_TOKEN clipmaker-ci:3d python3 scripts/finalize-premium-3d.py \
              --frames /frames --events /scene/motion-events.json \
              --output "/final/soft-body-${RECOVERY_OBSTACLE}-${RECOVERY_SEED}.mp4" \
              --metadata /final/metadata.json --duration "$RENDER_DURATION" --fps "$RENDER_FPS" \
              --seed "$RECOVERY_SEED" --obstacle "$RECOVERY_OBSTACLE" --music-profile "$RECOVERY_MUSIC_PROFILE"
      - name: Verify and report the recovered production video
        run: |
          video="artifacts/final/soft-body-${RECOVERY_OBSTACLE}-${RECOVERY_SEED}.mp4"
          docker run --rm --volume "$PWD/artifacts/final:/final:ro" clipmaker-ci:3d \
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames \
              -show_entries format=duration,size -of json "/final/$(basename "$video")" \
              > artifacts/final/ffprobe.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          probe = json.loads(Path("artifacts/final/ffprobe.json").read_text(encoding="utf-8"))
          stream = probe["streams"][0]
          expected = ("h264", 1080, 1920, "30/1", "900")
          actual = tuple(stream.get(key) for key in ("codec_name", "width", "height", "r_frame_rate", "nb_frames"))
          if actual != expected:
              raise SystemExit(f"Unexpected production stream: {stream}")
          report = (
              "# Recovered Soft Body 3D production\n\n"
              f"- Source run: `{os.environ['SOURCE_RUN_ID']}`\n"
              f"- Obstacle: `{os.environ['RECOVERY_OBSTACLE']}`\n"
              f"- Seed: `{os.environ['RECOVERY_SEED']}`\n"
              f"- Native frames: `900`\n"
              f"- Output: `1080x1920 @ 30 fps`\n"
              f"- Duration: `{probe['format']['duration']} s`\n"
          )
          Path("artifacts/final/recovery-report.md").write_text(report, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(report)
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: soft-body-reassembled-${{ inputs.reuse_run_id }}
          path: artifacts/final
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  notify:
    name: Notify the owner about the scheduled 3D render
    needs: [plan, prepare, render, retry_plan, retry, assemble]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN_RESULT: ${{ needs.plan.result }}
      PREPARE_RESULT: ${{ needs.prepare.result }}
      RENDER_RESULT: ${{ needs.render.result }}
      RETRY_RESULT: ${{ needs.retry.result }}
      MISSING_CHUNKS: ${{ needs.retry_plan.outputs.missing_count }}
      ASSEMBLE_RESULT: ${{ needs.assemble.result }}
      HAS_CHANNELS: ${{ needs.plan.outputs.has_channels }}
    steps:
      - name: Comment the daily automation status
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          successful=false
          if [[ "$HAS_CHANNELS" == "true" && "$PLAN_RESULT" == "success" && "$PREPARE_RESULT" == "success" && "$ASSEMBLE_RESULT" == "success" ]]; then
            successful=true
          fi

          if [[ "$successful" == "true" ]]; then
            heading="✅ Rendu 3D quotidien terminé"
            detail="L'artefact natif est prêt. La publication de 18 h l'importera automatiquement."
          else
            heading="❌ Échec du rendu 3D quotidien"
            detail="Aucune publication 3D ne sera tentée avec un artefact incomplet. Ouvrez le run pour voir l'étape en erreur."
          fi

          body=$(cat <<EOF
          ## ${heading}

          - Plan : \`${PLAN_RESULT}\`
          - Simulation : \`${PREPARE_RESULT}\`
          - Images natives : \`${RENDER_RESULT}\`
          - Lots manquants détectés : \`${MISSING_CHUNKS:-0}\`
          - Nouvelle tentative : \`${RETRY_RESULT}\`
          - Assemblage : \`${ASSEMBLE_RESULT}\`
          - Canaux 3D configurés : \`${HAS_CHANNELS}\`

          ${detail}

          [Ouvrir le workflow GitHub](${run_url})
          EOF
          )
          gh issue comment 36 --repo "$GITHUB_REPOSITORY" --body "$body"
