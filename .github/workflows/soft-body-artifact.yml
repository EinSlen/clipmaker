name: Soft Body 3D artifact

on:
  schedule:
    - cron: "7 0 * * *"
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      obstacle:
        description: Obstacle rendered in the 3D comparison
        required: true
        default: peg-grid
        type: choice
        options: [peg-grid, moving-slide, stair-cascade, v-stairs, pipe-bend, twin-gears, compression-ring]
      seed:
        description: Deterministic simulation seed
        required: true
        default: "910104"
        type: string
      samples:
        description: Eevee samples per native frame
        required: true
        default: "64"
        type: choice
        options: ["32", "64", "128"]
      chunk_size:
        description: Frames rendered by each parallel runner
        required: true
        default: "30"
        type: choice
        options: ["15", "30", "45"]
      title:
        description: Internal English hook stored in the scene
        required: true
        default: HOW SOFT CAN IT GET?
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: soft-body-3d-${{ github.run_id }}
  cancel-in-progress: false

env:
  FRAME_COUNT: "900"
  RENDER_FPS: "30"
  RENDER_DURATION: "30"
  RENDER_WIDTH: "1080"
  RENDER_HEIGHT: "1920"
  CLOUD_CONTROL_API: https://clipmaker-cloud-control.einslen.workers.dev

jobs:
  plan:
    name: Plan channels and native frame chunks
    runs-on: ubuntu-22.04
    outputs:
      channels: ${{ steps.matrix.outputs.channels }}
      frames: ${{ steps.matrix.outputs.frames }}
      has_channels: ${{ steps.matrix.outputs.has_channels }}
    env:
      CLIPMAKER_UPLOAD_TOKEN: ${{ secrets.CLIPMAKER_UPLOAD_TOKEN }}
      MANUAL_OBSTACLE: ${{ inputs.obstacle }}
      MANUAL_SEED: ${{ inputs.seed }}
      MANUAL_SAMPLES: ${{ inputs.samples }}
      MANUAL_CHUNK_SIZE: ${{ inputs.chunk_size }}
      MANUAL_TITLE: ${{ inputs.title }}
    steps:
      - name: Load the private cloud configuration for a scheduled run
        if: ${{ github.event_name == 'schedule' }}
        run: |
          test -n "$CLIPMAKER_UPLOAD_TOKEN" || { echo "Le jeton ClipMaker manque." >&2; exit 1; }
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLIPMAKER_UPLOAD_TOKEN" \
            "$CLOUD_CONTROL_API/api/workflow/bootstrap" > /tmp/cloud-bootstrap.json

      - id: matrix
        name: Build the channel and frame matrices
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Europe/Paris")).date().isoformat()
          channels = []
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              channels.append({
                  "channel_id": "manual-3d", "key": "manual-3d", "date": today,
                  "seed": int(os.environ.get("MANUAL_SEED") or "910104"),
                  "obstacle": os.environ.get("MANUAL_OBSTACLE") or "peg-grid",
                  "samples": int(os.environ.get("MANUAL_SAMPLES") or "64"),
                  "chunk_size": int(os.environ.get("MANUAL_CHUNK_SIZE") or "30"),
                  "title": (os.environ.get("MANUAL_TITLE") or "HOW SOFT CAN IT GET?")[:52],
                  "scheduled": False,
              })
          else:
              payload = json.loads(Path("/tmp/cloud-bootstrap.json").read_text(encoding="utf-8"))
              config = payload["config"]
              namespace = config.get("seedNamespace", "clipmaker-daily-v1")
              for channel in config.get("channels", []):
                  game = channel.get("game", {})
                  if not channel.get("enabled", True) or game.get("id") != "soft-body-slide":
                      continue
                  channel_id = channel["id"]
                  digest = hashlib.sha256(f"{namespace}:{channel_id}:{today}".encode()).digest()
                  seed = int.from_bytes(digest[:4], "big") & 0x7fffffff or 1
                  channels.append({
                      "channel_id": channel_id,
                      "key": re.sub(r"[^a-z0-9_-]", "-", channel_id.lower()),
                      "date": today, "seed": seed, "obstacle": game.get("obstacle", "auto"),
                      "samples": 64, "chunk_size": 30,
                      "title": str(game.get("title") or "HOW SOFT CAN IT GET?")[:52],
                      "scheduled": True,
                  })
          if len(channels) > 8:
              raise SystemExit("Maximum 8 canaux 3D par dépôt.")
          frames = []
          total = int(os.environ["FRAME_COUNT"])
          for channel in channels:
              for index, start in enumerate(range(1, total + 1, channel["chunk_size"]), 1):
                  frames.append({**channel, "index": index, "start": start, "end": min(total, start + channel["chunk_size"] - 1)})
          compact = lambda value: json.dumps({"include": value}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("channels=" + compact(channels) + "\n")
              output.write("frames=" + compact(frames) + "\n")
              output.write("has_channels=" + ("true" if channels else "false") + "\n")
          PY

  prepare:
    name: Simulate ${{ matrix.channel_id }}
    needs: plan
    if: ${{ needs.plan.outputs.has_channels == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.channels) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the reproducible renderer
        run: docker build --file web/Dockerfile --target ci --tag clipmaker-ci:3d .
      - name: Simulate every softness level once
        run: |
          mkdir -p artifacts/scene/frames
          docker run --rm --init --volume "$PWD/artifacts/scene:/scene" clipmaker-ci:3d \
            blender --background --factory-startup --python scripts/blender-soft-body-slide.py -- \
              --frames /scene/frames --duration "$RENDER_DURATION" --fps "$RENDER_FPS" \
              --width "$RENDER_WIDTH" --height "$RENDER_HEIGHT" --samples "${{ matrix.samples }}" \
              --seed "${{ matrix.seed }}" --softness 100 --theme ice --title "${{ matrix.title }}" \
              --obstacle "${{ matrix.obstacle }}" --events /scene/motion-events.json --build-only
          test -s artifacts/scene/frames/soft-body-comparison.blend
          test -s artifacts/scene/motion-events.json
      - uses: actions/upload-artifact@v4
        with:
          name: soft-body-scene-${{ matrix.key }}
          path: artifacts/scene
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  render:
    name: ${{ matrix.channel_id }} · frames ${{ matrix.start }}-${{ matrix.end }}
    needs: [plan, prepare]
    if: ${{ needs.plan.outputs.has_channels == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.frames) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soft-body-scene-${{ matrix.key }}
          path: artifacts/scene
      - name: Build the reproducible renderer
        run: docker build --file web/Dockerfile --target ci --tag clipmaker-ci:3d .
      - name: Render this native frame range
        run: |
          mkdir -p artifacts/chunk
          docker run --rm --init --volume "$PWD/artifacts/scene:/scene:ro" --volume "$PWD/artifacts/chunk:/output" \
            clipmaker-ci:3d blender --background /scene/frames/soft-body-comparison.blend \
              --render-output /output/frame_ --frame-start "${{ matrix.start }}" --frame-end "${{ matrix.end }}" --render-anim
          test -s "artifacts/chunk/frame_$(printf '%04d' '${{ matrix.start }}').png"
          test -s "artifacts/chunk/frame_$(printf '%04d' '${{ matrix.end }}').png"
      - uses: actions/upload-artifact@v4
        with:
          name: soft-body-frames-${{ matrix.key }}-${{ matrix.index }}
          path: artifacts/chunk
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  assemble:
    name: Assemble ${{ matrix.channel_id }}
    needs: [plan, prepare, render]
    if: ${{ needs.plan.outputs.has_channels == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.channels) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soft-body-scene-${{ matrix.key }}
          path: artifacts/scene
      - uses: actions/download-artifact@v4
        with:
          pattern: soft-body-frames-${{ matrix.key }}-*
          path: artifacts/frames
          merge-multiple: true
      - name: Require the complete native sequence
        run: test "$(find artifacts/frames -maxdepth 1 -name 'frame_*.png' | wc -l)" -eq "$FRAME_COUNT"
      - name: Build the reproducible renderer
        run: docker build --file web/Dockerfile --target ci --tag clipmaker-ci:3d .
      - name: Encode video, generated music and collision Foley
        run: |
          mkdir -p artifacts/final
          docker run --rm --init --volume "$PWD/artifacts/frames:/frames:ro" --volume "$PWD/artifacts/scene:/scene:ro" \
            --volume "$PWD/artifacts/final:/final" clipmaker-ci:3d python3 scripts/finalize-premium-3d.py \
              --frames /frames --events /scene/motion-events.json \
              --output "/final/soft-body-${{ matrix.obstacle }}-${{ matrix.seed }}.mp4" \
              --metadata /final/metadata.json --duration "$RENDER_DURATION" --fps "$RENDER_FPS" \
              --seed "${{ matrix.seed }}" --obstacle "${{ matrix.obstacle }}"
      - name: Create the publisher import manifest and verify the MP4
        env:
          CHANNEL_ID: ${{ matrix.channel_id }}
          DAILY_DATE: ${{ matrix.date }}
          DAILY_SEED: ${{ matrix.seed }}
          DAILY_OBSTACLE: ${{ matrix.obstacle }}
          DAILY_TITLE: ${{ matrix.title }}
        run: |
          video="artifacts/final/soft-body-${DAILY_OBSTACLE}-${DAILY_SEED}.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json "$video" > artifacts/final/ffprobe.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("artifacts/final/metadata.json").read_text(encoding="utf-8"))
          title = os.environ["DAILY_TITLE"]
          video = f"soft-body-{os.environ['DAILY_OBSTACLE']}-{os.environ['DAILY_SEED']}.mp4"
          manifest = {
              "date": os.environ["DAILY_DATE"], "channelId": os.environ["CHANNEL_ID"],
              "seed": int(os.environ["DAILY_SEED"]), "video": video,
              "render": {
                  "title": title, "youtubeTitle": f"{title} #shorts",
                  "caption": f"{title} 0% to 100% soft body comparison. Did you predict the ending?",
                  "tags": ["#softbody", "#satisfying", "#simulation", "#shorts"],
                  "duration": 30, "outcome": "comparison-complete",
                  "variantKey": metadata.get("variant_key", os.environ["DAILY_OBSTACLE"]), "raw": metadata,
              },
          }
          Path("artifacts/final/publisher-import.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("artifacts/final/report.md").write_text(
              f"# Soft Body 3D production\n\n- Channel: `{os.environ['CHANNEL_ID']}`\n- Obstacle: `{os.environ['DAILY_OBSTACLE']}`\n- Native: `1080x1920 @ 30 fps`\n- Frames: `{metadata['frames']}`\n- Outcome: `{metadata['outcome']}`\n",
              encoding="utf-8",
          )
          PY
          cat artifacts/final/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: soft-body-daily-${{ matrix.date }}-${{ matrix.key }}
          path: artifacts/final
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
