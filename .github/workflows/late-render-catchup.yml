name: Catch up a late daily 3D render

on:
  workflow_run:
    workflows: [Soft Body 3D artifact]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: late-render-catchup
  cancel-in-progress: false

jobs:
  catch-up:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      # Never check out the triggering SHA or execute downloaded artifacts.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Resume only due production slots with completed native renders
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPMAKER_UPLOAD_TOKEN: ${{ secrets.CLIPMAKER_UPLOAD_TOKEN }}
        run: node web/scripts/catch-up-render.mjs
