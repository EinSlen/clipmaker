name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deep_3d:
        description: Audit all seven 3D obstacle families at five softness levels
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Web, engines, publisher and Worker
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            infra/cloud-control-worker/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the renderer test dependency
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Install the web application
        run: npm ci --prefix web
      - name: Test and build the web application
        run: |
          npm --prefix web test
          npm --prefix web run build
      - name: Install and test the Cloudflare Worker
        run: |
          npm ci --prefix infra/cloud-control-worker
          npm --prefix infra/cloud-control-worker run check
          npm --prefix infra/cloud-control-worker test
      - name: Test the public cloud dashboard contract
        run: node --test cloud-dashboard/*.test.mjs

  infrastructure:
    name: Workflows, Python and Docker configuration
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate workflow YAML
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python - <<'PY'
          import glob
          import yaml

          paths = glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml')
          if not paths:
              raise SystemExit('No GitHub workflows found.')
          for path in paths:
              with open(path, encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'YAML OK: {path}')
          PY
      - name: Compile the Python renderers
        run: python -m compileall -q web/scripts
      - name: Validate Docker Compose
        run: |
          cp web/.env.example web/.env.local
          docker compose config --quiet

  soft-body-surface:
    name: Blender surface contacts and repeat timing
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build the production Blender environment
        run: docker build --file web/Dockerfile --target ci --tag clipmaker-ci:surface .
      - name: Test contact skinning, every spawn and the animated reset
        run: |
          docker run --rm --init clipmaker-ci:surface \
            blender --background --factory-startup --python-exit-code 1 \
            --python /app/scripts/test_soft_body_surface_blender.py

  soft-body-physics:
    name: 3D audit · ${{ matrix.obstacle }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_3d }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        obstacle: [moving-slide, stair-cascade, v-stairs, peg-grid, pipe-bend, twin-gears, compression-ring]
    steps:
      - uses: actions/checkout@v6
      - name: Build the production Blender environment
        run: docker build --file web/Dockerfile --target ci --tag clipmaker-ci:audit .
      - name: Audit the native simulation and rendered obstacle surfaces
        run: |
          mkdir -p artifacts/3d-audit
          docker run --rm --init --volume "$PWD/artifacts/3d-audit:/output" clipmaker-ci:audit \
            blender --background --factory-startup --python-exit-code 1 \
            --python /app/scripts/audit-soft-body-3d.py -- \
            --seeds 910103 --obstacles '${{ matrix.obstacle }}' --softness 0,25,55,75,100 \
            --sample-fps 3 --check-surface --output /output/report.json
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: soft-body-audit-${{ matrix.obstacle }}
          path: artifacts/3d-audit
          if-no-files-found: error
          retention-days: 7
