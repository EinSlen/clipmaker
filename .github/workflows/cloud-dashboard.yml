name: Deploy ClipMaker cloud dashboard

on:
  push:
    branches: [main]
    paths:
      - cloud-dashboard/**
      - .github/workflows/cloud-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the cloud control panel
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload the static dashboard
        uses: actions/upload-pages-artifact@v5
        with:
          path: cloud-dashboard
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
