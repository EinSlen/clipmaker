services:
  clipmaker:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: runtime
    image: clipmaker:latest
    container_name: clipmaker
    restart: unless-stopped
    ports:
      - "${CLIPMAKER_BIND_HOST:-127.0.0.1}:3000:3000"
    env_file:
      - ./web/.env.local
    environment:
      REPO_ROOT: /repo
      PYTHON_BIN: python3
      BLENDER_BIN: blender
      GAME_RENDER_WIDTH: "${GAME_RENDER_WIDTH:-1080}"
      GAME_RENDER_HEIGHT: "${GAME_RENDER_HEIGHT:-1920}"
      GAME_RENDER_FPS: "${GAME_RENDER_FPS:-60}"
    volumes:
      # Mount the whole repo so the app sees vendor/TiktokAutoUploader/CookiesDir/.
      - ./:/repo
      - ./web/uploads:/app/uploads
      - ./web/renders:/app/renders
      - ./web/public/music:/app/public/music
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Orchestrateur quotidien. Il reste inactif tant que le profil `publisher`
  # n'est pas démarré et que config/publisher.json conserve dryRun=true.
  publisher:
    image: clipmaker:latest
    container_name: clipmaker-publisher
    restart: unless-stopped
    profiles: ["publisher"]
    env_file:
      - ./web/.env.local
    environment:
      REPO_ROOT: /repo
      PUBLISHER_CONFIG: /repo/web/config/publisher.json
      PUBLISHER_BASE_URL: http://clipmaker:3000
    depends_on:
      clipmaker:
        condition: service_healthy
    volumes:
      - ./:/repo
    command: ["node", "/repo/web/scripts/publisher.mjs", "daemon", "--config", "/repo/web/config/publisher.json"]

  # Connexion TikTok initiale, accessible seulement à travers un tunnel SSH.
  tiktok-auth:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: browser-auth
    image: clipmaker-browser-auth:latest
    restart: unless-stopped
    profiles: ["tiktok-auth"]
    ports:
      - "127.0.0.1:6081:6080"
    environment:
      REPO_ROOT: /repo
      TIKTOK_USERNAME: "${TIKTOK_USERNAME:-}"
      AUTH_PUBLIC_PORT: "6081"
      AUTH_REQUEST_FILE: /repo/web/data/auth/tiktok-request.txt
      DISPLAY: :99
    volumes:
      - ./:/repo
    command: ["bash", "scripts/tiktok-auth-vnc.sh"]

  # Public HTTPS URL with zero config, no account, no token. Ephemeral domain
  # (regenerated on each restart). Bring it up with:
  #   docker compose --profile tunnel up -d
  # Find the URL with:
  #   docker compose logs tunnel | grep trycloudflare.com
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: clipmaker-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://clipmaker:3000
    depends_on:
      - clipmaker
