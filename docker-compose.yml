services:
  clipmaker:
    build:
      context: ./web
      target: runtime
    image: clipmaker:latest
    container_name: clipmaker
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env.local
    environment:
      REPO_ROOT: /repo
      PYTHON_BIN: python3
      YOUTUBE_BROWSER_PATH: /usr/bin/chromium
      YOUTUBE_BROWSER_DATA_DIR: /repo/.youtube-browser
      YOUTUBE_BROWSER_DRY_RUN: "${YOUTUBE_BROWSER_DRY_RUN:-true}"
      CLIPMAKER_UPLOAD_TOKEN: "${CLIPMAKER_UPLOAD_TOKEN:-}"
    volumes:
      # Mount the whole repo so the app sees vendor/TiktokAutoUploader/CookiesDir/.
      - ./:/repo
      - ./web/uploads:/app/uploads
      - ./web/renders:/app/renders
      - ./web/public/music:/app/public/music

  # Connexion YouTube initiale sur un VPS Linux. Le port noVNC n'écoute que
  # localhost : utiliser un tunnel SSH avant d'ouvrir http://localhost:6080.
  youtube-auth:
    build:
      context: ./web
      target: youtube-auth
    image: clipmaker-youtube-auth:latest
    profiles: ["youtube-auth"]
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      REPO_ROOT: /repo
      YOUTUBE_BROWSER_PATH: /usr/bin/chromium
      YOUTUBE_BROWSER_DATA_DIR: /repo/.youtube-browser
      YOUTUBE_ACCOUNT: "${YOUTUBE_ACCOUNT:-default}"
      DISPLAY: :99
    volumes:
      - ./:/repo
    command: ["bash", "scripts/youtube-auth-vnc.sh"]

  # Public HTTPS URL with zero config, no account, no token. Ephemeral domain
  # (regenerated on each restart). Bring it up with:
  #   docker compose --profile tunnel up -d
  # Find the URL with:
  #   docker compose logs tunnel | grep trycloudflare.com
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: clipmaker-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://clipmaker:3000
    depends_on:
      - clipmaker
